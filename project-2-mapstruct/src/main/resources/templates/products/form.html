<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cellphoneX - Product</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><strong>cellphoneX</strong><nav><a href="/products">Products</a><a class="nav-add" href="/products/new">+ Thêm sản phẩm</a></nav></header><main class="form-page"><a class="back" href="/products">← Quay lại danh sách</a><div class="form-heading"><span class="eyebrow">PRODUCT EDITOR</span><h1 th:text="${product.id == null ? 'Thêm sản phẩm mới' : 'Cập nhật sản phẩm'}">Thêm sản phẩm mới</h1><p>Điền thông tin sản phẩm và hình ảnh minh họa.</p></div><form class="product-form" th:action="@{/products/save}" th:object="${product}" method="post"><input type="hidden" th:field="*{id}"><div class="fields"><label>Tên sản phẩm<input required th:field="*{name}" placeholder="Ví dụ: Điện thoại Oppo A6"></label><label>Giá (VNĐ)<input required type="number" step="0.01" th:field="*{price}" placeholder="8000000"></label><label>Số lượng<input required type="number" th:field="*{quantity}" placeholder="100"></label></div><label>Mô tả<textarea th:field="*{description}" rows="4" placeholder="Mô tả sản phẩm..."></textarea></label><label>Đường dẫn hình ảnh<input id="imageUrl" th:field="*{imageUrl}" placeholder="https://images.unsplash.com/..."></label><div class="preview-wrap"><span>Xem trước</span><img id="preview" th:src="${product.imageUrl}" alt="Preview"></div><label class="upload">Chọn file để xem trước<input id="imageFile" type="file" accept="image/*"></label><div class="form-actions"><button class="primary" type="submit">Lưu sản phẩm</button><a class="cancel" href="/products">Hủy</a></div></form></main><footer>Spring Boot • cellphoneX • MapStruct</footer><script>const url=document.getElementById('imageUrl'),preview=document.getElementById('preview'),file=document.getElementById('imageFile');url.addEventListener('input',()=>preview.src=url.value);file.addEventListener('change',()=>{if(file.files[0])preview.src=URL.createObjectURL(file.files[0])});</script></body></html>
