<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cellphoneX - Products</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><strong>cellphoneX</strong><nav><a href="/products">Products</a><a class="nav-add" href="/products/new">+ Thêm sản phẩm</a></nav></header><main><div class="intro"><div><span class="eyebrow">SPRING BOOT • MAPSTRUCT DTO</span><h1>Danh sách sản phẩm</h1><p>Quản lý kho hàng đơn giản và trực quan.</p></div><a class="primary" href="/products/new">+ Thêm sản phẩm</a></div><form class="toolbar" method="get" action="/products"><input name="keyword" th:value="${keyword}" placeholder="Nhập tên sản phẩm..."><select name="size"><option value="5">5 sản phẩm</option><option value="10">10 sản phẩm</option></select><button class="success">Tìm kiếm</button></form><section class="table-card"><table><thead><tr><th>ID</th><th>Hình ảnh</th><th>Tên sản phẩm</th><th>Giá</th><th>Số lượng</th><th>Mô tả</th><th>Thao tác</th></tr></thead><tbody><tr th:if="${products.empty}"><td colspan="7" class="empty">Chưa có sản phẩm nào.</td></tr><tr th:each="product : ${products}"><td class="muted" th:text="${product.id}">1</td><td><img class="product-img" th:src="${product.imageUrl}" alt="Ảnh sản phẩm"></td><td><strong th:text="${product.name}">Tên sản phẩm</strong></td><td class="price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</td><td><span class="stock" th:text="${product.quantity}">0</span></td><td class="description" th:text="${product.description}">Mô tả</td><td><div class="actions"><a class="edit" th:href="@{/products/{id}/edit(id=${product.id})}">Sửa</a><form th:action="@{/products/{id}/delete(id=${product.id})}" method="post"><button class="delete" onclick="return confirm('Xóa sản phẩm này?')">Xóa</button></form></div></td></tr></tbody></table></section><div class="pager" th:if="${page.totalPages > 1}"><a th:if="${page.number > 0}" th:href="@{/products(page=${page.number-1},keyword=${keyword})}">← Trước</a><span>Trang <b th:text="${page.number+1}">1</b> / <b th:text="${page.totalPages}">1</b></span><a th:if="${page.number+1 < page.totalPages}" th:href="@{/products(page=${page.number+1},keyword=${keyword})}">Sau →</a></div></main><footer>Spring Boot • cellphoneX • MapStruct</footer></body></html>
