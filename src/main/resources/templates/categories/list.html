<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<section layout:fragment="content">
    <div class="content-panel">
        <div class="header-row">
            <div>
                <h1>Quản lý danh mục</h1>
                <p class="subtitle">Danh sách và tìm kiếm danh mục</p>
            </div>
            <a th:href="@{/categories/new}" class="btn btn-primary">+ Thêm mới</a>
        </div>

        <form th:action="@{/categories}" method="get" class="search-box">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm theo tên hoặc mô tả...">
            <button type="submit" class="btn btn-secondary">Tìm kiếm</button>
            <a th:href="@{/categories}" class="btn btn-light">Xóa lọc</a>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên danh mục</th>
                    <th>Mô tả</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="4" class="empty">Không có dữ liệu phù hợp.</td>
                </tr>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}">1</td>
                    <td th:text="${category.name}">Tên</td>
                    <td th:text="${category.description != null ? category.description : '—'}">Mô tả</td>
                    <td class="actions">
                        <a th:href="@{/categories/{id}/edit(id=${category.id}, keyword=${keyword})}" class="btn btn-small btn-primary">Sửa</a>
                        <form th:action="@{/categories/{id}/delete(id=${category.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa?');">
                            <input type="hidden" name="keyword" th:value="${keyword}">
                            <button type="submit" class="btn btn-small btn-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${page.totalPages > 1}">
            <a th:if="${page.number > 0}"
               th:href="@{/categories(page=${page.number - 1}, size=${pageSize}, keyword=${keyword})}">Trước</a>
            <span>Trang <strong th:text="${page.number + 1}">1</strong> / <span th:text="${page.totalPages}">1</span></span>
            <a th:if="${page.number + 1 < page.totalPages}"
               th:href="@{/categories(page=${page.number + 1}, size=${pageSize}, keyword=${keyword})}">Sau</a>
        </div>
    </div>
</section>
</body>
</html>
