<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cellphoneX - Product</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header><strong>cellphoneX</strong><nav><a href="/products">Home</a><a href="/products">Products</a><a href="/products/new">About</a><input placeholder="Search products..."></nav></header>
<main class="form-page"><a class="back" href="/products">&lt;- Quay lại danh sách</a><div class="form-heading"><b>CONTENT</b><h1 th:text="${product.id == null ? 'Create Product' : 'Edit Product'}">Create Product</h1></div>
<form class="product-form" th:action="@{/products/save}" th:object="${product}" method="post"><input type="hidden" th:field="*{id}"><label>Name<input required th:field="*{name}" placeholder="Laptop"></label><label>Price<input required type="number" step="0.01" th:field="*{price}" placeholder="1200.00"></label><label>Quantity<input required type="number" th:field="*{quantity}" placeholder="10"></label><div class="form-actions"><button class="primary" type="submit">Save</button><a class="cancel" href="/products">Cancel</a></div></form></main><footer>Spring Boot - Manual Mapper + ModelMapper</footer></body></html>
