<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cellphoneX - Products</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header><strong>cellphoneX</strong><nav><a href="/products">Home</a><a href="/products">Products</a><a href="/products/new">About</a><input name="topSearch" placeholder="Search products..."></nav></header>
<div class="layout"><aside><h3>HEADER</h3><a href="/products">Home</a><a class="active" href="/products">Products</a><a href="/products/new">About</a><small>Navigation</small></aside>
<main><div class="content-title"><div><b>CONTENT</b><h1>Danh sách sản phẩm</h1></div><a class="primary" href="/products/new">+ Create Product</a></div>
<form class="toolbar" method="get" action="/products"><input name="keyword" th:value="${keyword}" placeholder="Search by name..."><button class="success">Search</button></form>
<section class="table-card"><table><thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Quantity</th><th>Actions</th></tr></thead><tbody><tr th:if="${products.empty}"><td colspan="5" class="empty">No products found.</td></tr><tr th:each="product : ${products}"><td th:text="${product.id}">1</td><td><strong th:text="${product.name}">Laptop</strong></td><td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}">1200.00</td><td th:text="${product.quantity}">10</td><td><div class="actions"><a class="edit" th:href="@{/products/{id}/edit(id=${product.id})}">Edit</a><form th:action="@{/products/{id}/delete(id=${product.id})}" method="post"><button class="delete" onclick="return confirm('Delete this product?')">Delete</button></form></div></td></tr></tbody></table></section>
<div class="pager"><a th:if="${page.number > 0}" th:href="@{/products(page=${page.number-1},keyword=${keyword})}">Previous</a><span th:text="${page.number+1}">1</span><a th:if="${page.number+1 < page.totalPages}" th:href="@{/products(page=${page.number+1},keyword=${keyword})}">Next</a></div></main>
<aside class="footer-side"><h3>FOOTER</h3><p>© 2025 cellphoneX</p><p>All rights reserved.</p><small>Copyright</small></aside></div><footer>Spring Boot - Manual Mapper + ModelMapper</footer>
</body></html>
